server {
  listen 80;
  server_name _;

  # Allow large model uploads via /api/upload (default is too small).
  client_max_body_size 2g;

  # Docker DNS. Using variables in proxy_pass defers resolution to request-time,
  # so nginx won't fail to start if the upstream container restarts.
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $asset_server asset-server;

  root /usr/share/nginx/html;
  index index.html;

  location / {
    try_files $uri $uri/ /index.html;
  }

  location /api/ {
    proxy_pass http://$asset_server:8080;
    proxy_set_header Host $host;
    proxy_request_buffering off;
  }

  location /wmx/ {
    proxy_pass http://$asset_server:8080;
    proxy_set_header Host $host;
  }
}

